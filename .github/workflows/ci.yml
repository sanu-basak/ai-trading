name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck & build
    runs-on: ubuntu-latest
    env:
      # Dummy value: `prisma generate` needs the datasource env to resolve,
      # but never connects to a database during codegen/typecheck.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @devquantic/api exec prisma generate

      - name: Validate Prisma schema
        run: pnpm --filter @devquantic/api exec prisma validate

      - name: Typecheck
        run: pnpm --filter @devquantic/api typecheck

      - name: Build
        run: pnpm --filter @devquantic/api build

      - name: Unit tests
        run: pnpm --filter @devquantic/api test

  ai-engine:
    name: AI Engine — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q
