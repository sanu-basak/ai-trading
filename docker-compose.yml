# ===========================================================================
# DEVQUANTIC AI Trading Analyst — full local/prod stack.
#   docker compose up --build
# Secrets below have DEV defaults; override them in a root .env for production
# (see infra/env/docker.env.example). NEVER ship the defaults to production.
# ===========================================================================

x-common-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-devquantic}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devquantic}
  POSTGRES_DB: ${POSTGRES_DB:-devquantic}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-devquantic} -d ${POSTGRES_DB:-devquantic}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [devquantic]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [devquantic]

  ai-engine:
    build:
      context: .
      dockerfile: infra/docker/ai-engine/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: '8000'
      CORS_ORIGINS: ${API_BASE_URL:-http://localhost:4000}
    ports:
      - '${AI_ENGINE_PORT:-8000}:8000'
    networks: [devquantic]

  # One-shot: apply migrations and seed, then exit. The API waits for it.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devquantic}:${POSTGRES_PASSWORD:-devquantic}@postgres:5432/${POSTGRES_DB:-devquantic}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@devquantic.ai}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe_123!}
    command: ['sh', '-c', 'pnpm exec prisma migrate deploy && pnpm run db:seed']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [devquantic]

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-devquantic}:${POSTGRES_PASSWORD:-devquantic}@postgres:5432/${POSTGRES_DB:-devquantic}?schema=public
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me-32bytes!}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_started
    networks: [devquantic]

volumes:
  pgdata:
  redisdata:

networks:
  devquantic:
    driver: bridge
